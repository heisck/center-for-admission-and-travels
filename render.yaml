services:
  - type: web
    name: center-for-admission-travels
    env: node
    buildCommand: npm ci && npm run build:ci
    preDeployCommand: npm run release
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYMENT_CURRENCY
        value: GHS
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: RATE_LIMIT_PREFIX
        value: cfaat
      - key: RATE_LIMIT_FAIL_CLOSED
        value: true
      - key: ENABLE_TEST_EMAIL_ENDPOINT
        value: false
      - key: ENABLE_ADMIN_SEED_ENDPOINT
        value: false
      - key: ALLOW_DATABASE_SEED
        value: false
      - key: ALLOW_PRODUCTION_SEED
        value: false
      - key: NODE_ENV
        value: production

databases:
  - name: center-for-admission-travels-db
    databaseName: center_for_admission_travels
    user: center_for_admission_travels_user
    plan: free
