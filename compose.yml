services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: center_for_admission_travels
      POSTGRES_USER: cfaat
      POSTGRES_PASSWORD: cfaat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfaat -d center_for_admission_travels"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cfaat:cfaat_dev_password@db:5432/center_for_admission_travels
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      ALLOW_DATABASE_SEED: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  postgres_data:
  node_modules:
  next_cache:
